<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ағылшын карточкалары</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fa;--surface:#fff;--ink:#14213d;--muted:#5b6b82;--line:#d5dde8;--accent:#0f7b8a;--accent-ink:#fff;--mark:#ffd84d;--bad:#b5483a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1623;--surface:#172236;--ink:#e8eef7;--muted:#9fb0c8;--line:#2a3a54;--accent:#4cc3d3;--accent-ink:#06222a;--mark:#8a6d00;--bad:#e58a7c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1623;--surface:#172236;--ink:#e8eef7;--muted:#9fb0c8;--line:#2a3a54;--accent:#4cc3d3;--accent-ink:#06222a;--mark:#8a6d00;--bad:#e58a7c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Atkinson Hyperlegible",system-ui,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;min-height:260px;display:flex;flex-direction:column;gap:16px}
.sent{font-size:1.45rem;line-height:1.45;margin:0}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 4px;font-weight:700}
.w{cursor:pointer;border-radius:4px}
.w:hover{outline:1px dashed var(--muted)}
.w:focus-visible{outline:3px solid var(--accent)}
.on{background:var(--mark);font-weight:700;border-radius:4px}
.back{border-top:1px solid var(--line);padding-top:14px}
.tr{font-size:1.2rem;margin:0 0 12px}
.tr.ru{font-size:1.05rem;color:var(--muted);margin:-6px 0 12px}
.kk.ru{font-weight:400;color:var(--muted)}
.kk{font-size:1.05rem;font-weight:700;margin:0 0 4px}
.def{color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
button,a.btn{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,a.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hide{display:none}
details{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
summary{cursor:pointer;font-weight:700}
label{display:block;margin:12px 0 4px;font-size:.95rem}
input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.done{text-align:center;padding:30px 0}
.tip{color:var(--muted);font-size:.9rem;margin-top:16px}
</style>
</head>
<body>
<main>
<h1>Сөздерді сөйлеммен жаттау</h1>
<p class="sub">Американдық ағылшын. Сөйлемді оқы, білмейтін сөзге сурет қарап мағынасын тап, содан кейін жауабын тексер.</p>
<div class="bar"><i id="bar"></i></div>
<div class="stat" id="stat"></div>
<div id="stage"></div>
<details>
<summary>Өз сөзіңді қос</summary>
<label for="nw">Сөз немесе тіркес</label><input id="nw" autocomplete="off">
<label for="ns">Сөйлем (сөзді өзің құрастырған сөйлемге қой)</label><input id="ns" autocomplete="off">
<label for="nk">Сөздің қазақша мағынасы (міндетті емес)</label><input id="nk" autocomplete="off">
<label for="nt">Сөйлемнің қазақша аудармасы (міндетті емес)</label><input id="nt" autocomplete="off">
<div class="row" style="margin-top:14px"><button class="main" id="add" type="button">Қосу</button></div>
<div class="tip" id="addmsg"></div>
</details>
<p class="tip">Қосқан сөздерің мен «Білемін» деп белгілеген карточкаларың осы браузерде сақталады.</p>
<button type="button" id="reset">Прогрессті тазалап, басынан бастау</button>
</main>
<script>
var BASE=[
["Let me [[grab]] a coffee before work.","ұстап алу, тез алып қою (кофе ішіп алу)","to get something quickly"],
["Please walk on the [[sidewalk]], not in the street.","тротуар","the path for people beside a road"],
["The [[elevator]] is broken, so we take the stairs.","лифт","a machine that takes you up and down in a building"],
["Throw the paper in the [[trash can]].","қоқыс жәшігі","a container for garbage"],
["The bus was so [[crowded]] that I had to stand.","адам тығыз, адам көп","full of people"],
["Can I [[borrow]] your charger for a minute?","уақытша алу, сұрап алу","to use something and give it back later"],
["I forgot my [[wallet]] at home.","әмиян","a small case for money and cards"],
["Keep the [[receipt]] in case you need to return it.","чек (төлем чегі)","a paper that shows what you paid for"],
["There’s a long [[line]] at the grocery store.","кезек","people waiting one behind another"],
["Can I get this [[to go]]?","өзіммен алып кету үшін","food you take with you, not eat in the restaurant"],
["I live in a small [[apartment]] downtown.","пәтер","a home in a bigger building"],
["These shoes are [[cheap]], but they look good.","арзан","not expensive"],
["I’ll [[pick you up]] at six.","сені алып кету (көлікпен)","to come by car and take someone with you"],
["After the long flight, I was [[exhausted]].","қатты шаршаған","very, very tired"],
["We stopped at a [[gas station]] to fill the tank.","жанармай бекеті","a place where you buy gas for your car"]
];
var TR=["Жұмысқа дейін кофе ішіп алайыншы.","Көшемен емес, тротуармен жүріңіз.","Лифт бұзылған, сондықтан біз баспалдақпен көтеріліп жатырмыз.","Қағазды қоқыс жәшігіне тастаңыз.","Автобус сонша адам көп болды, мен тұруға мәжбүр болдым.","Зарядтағышыңды бір минутқа алып тұрсам бола ма?","Әмиянымды үйде ұмытып кетіппін.","Қайтару қажет болса деп, чекті сақтап қой.","Азық-түлік дүкенінде ұзын кезек тұр.","Мұны өзіммен алып кетсем бола ма?","Мен қала орталығындағы шағын пәтерде тұрамын.","Бұл аяқкиім арзан, бірақ әдемі көрінеді.","Сені сағат алтыда алып кетемін.","Ұзақ ұшудан кейін мен қатты шаршадым.","Бак толтыру үшін жанармай бекетіне тоқтадық."];
var RUK=["схватить, быстро взять", "тротуар", "лифт", "мусорное ведро, урна", "многолюдный, переполненный", "одолжить (взять на время)", "кошелёк", "чек", "очередь", "с собой (еда на вынос)", "квартира", "дешёвый", "заехать за тобой, забрать тебя", "совершенно без сил, измотанный", "заправка (АЗС)"],RUT=["Давай я куплю кофе перед работой.", "Пожалуйста, идите по тротуару, а не по дороге.", "Лифт сломан, поэтому мы идём по лестнице.", "Выбросьте бумагу в мусорное ведро.", "Автобус был так переполнен, что мне пришлось стоять.", "Можно одолжить у тебя зарядку на минуту?", "Я забыл кошелёк дома.", "Сохрани чек на случай, если нужно будет вернуть товар.", "В продуктовом магазине длинная очередь.", "Можно это с собой?", "Я живу в маленькой квартире в центре города.", "Эти туфли дешёвые, но выглядят хорошо.", "Я заеду за тобой в шесть.", "После долгого перелёта я был совершенно без сил.", "Мы остановились на заправке, чтобы заправить машину."];
var KNOWN_KEY="eng-cards-known-v1",known=[];
try{known=JSON.parse(localStorage.getItem(KNOWN_KEY)||"[]")}catch(e){known=[]}
function saveKnown(){try{localStorage.setItem(KNOWN_KEY,JSON.stringify(known))}catch(e){}}
var KEY="eng-cards-custom-v1",custom=[],queue=[],total=0,cur=null,shown=false,sel=null,selW=null;
try{custom=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){custom=[]}
function esc(t){return t.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hl(s,w){if(s.indexOf("[[")>-1)return esc(s).replace("[[","<mark>").replace("]]","</mark>");
var i=s.toLowerCase().indexOf(w.toLowerCase());if(i<0)return esc(s);
return esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+w.length))+"</mark>"+esc(s.slice(i+w.length))}
function wordOf(c){var m=c[0].match(/\[\[(.+?)\]\]/);return m?m[1]:c[3]}
var SHEET=null;
function all(){var base=SHEET?SHEET.map(function(r){return[r.s,r.k,r.d,r.w,r.t,r.rk,r.rt]}):BASE.map(function(c,i){return[c[0],c[1],c[2],null,TR[i],RUK[i],RUT[i]]});return base.concat(custom.map(function(c){return[c.s,c.k||"",c.d||"",c.w,c.t||""]}))}
function start(){var a=all();queue=[];a.forEach(function(c,i){if(known.indexOf(c[0])<0)queue.push(i)});total=a.length;next()}
var rec=null,chunks=[],myUrl=null,micMsg="",myBuf=null,myOnset=0,ctx=null,src=null;
function micStart(){
if(!navigator.mediaDevices||!window.MediaRecorder){micMsg="Бұл браузерде дауыс жазу қолдау таппайды.";render();return}
if(window.speechSynthesis)speechSynthesis.cancel();
var rc=cur;
navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(stream){
chunks=[];var r=new MediaRecorder(stream);rec=r;
r.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
r.onstop=function(){stream.getTracks().forEach(function(t){t.stop()});rec=null;
if(rc!==cur)return;
if(myUrl)URL.revokeObjectURL(myUrl);
var bl=new Blob(chunks,{type:r.mimeType||"audio/webm"});myUrl=URL.createObjectURL(bl);myBuf=null;myOnset=0;render();decodeMine(bl,rc)};
r.start();micMsg="";render()
}).catch(function(er){micMsg="Микрофон қолжетімсіз ("+(er&&er.name||"error")+"). Бет басқа беттің ішінде ашылған болуы мүмкін, оны жеке бетте ашып көр.";render()})}
function micStop(){if(rec&&rec.state!=="inactive")rec.stop()}
function decodeMine(bl,rc){
try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();
bl.arrayBuffer().then(function(ab){return new Promise(function(ok,no){ctx.decodeAudioData(ab,ok,no)})}).then(function(buf){if(rc!==cur)return;myBuf=buf;myOnset=findOnset(buf)}).catch(function(){})}catch(e){}}
function findOnset(buf){var d=buf.getChannelData(0),w=Math.max(1,Math.round(buf.sampleRate*0.01)),n=Math.floor(d.length/w),r=[],i,j,s,x,peak=0;
for(i=0;i<n;i++){s=0;for(j=0;j<w;j++){x=d[i*w+j];s+=x*x}r.push(Math.sqrt(s/w));if(r[i]>peak)peak=r[i]}
var thr=Math.max(peak*0.2,0.008);
for(i=0;i<n-2;i++){if(r[i]>thr&&r[i+1]>thr&&r[i+2]>thr)return Math.max(0,i*0.01-0.05)}
return 0}
function stopMine(){try{if(src)src.stop()}catch(e){}src=null}
function playMine(from){stopMine();from=typeof from==="number"?from:0;
if(myBuf&&ctx){if(ctx.state==="suspended")ctx.resume();src=ctx.createBufferSource();src.buffer=myBuf;src.connect(ctx.destination);src.start(0,from);return}
if(myUrl)new Audio(myUrl).play()}
function speak(t,r,cb,st){if(rec)return;
if(!window.speechSynthesis){alert("Бұл браузер дауыстап оқуды қолдамайды.");return}
speechSynthesis.cancel();
var u=new SpeechSynthesisUtterance(t.replace(/\[\[|\]\]/g,""));
u.lang="en-US";u.rate=r;
var v=speechSynthesis.getVoices().filter(function(x){return x.lang==="en-US"||x.lang==="en_US"});
if(v.length)u.voice=v[0];
if(cb)u.onend=cb;
if(st)u.onstart=st;
speechSynthesis.speak(u)}
function parts(c){var m=c[0].match(/\[\[(.+?)\]\]/),plain=c[0].replace(/\[\[|\]\]/g,""),a,b;
if(m){a=c[0].indexOf("[[");b=a+m[1].length}else{a=c[3]?plain.toLowerCase().indexOf(c[3].toLowerCase()):-1;b=a<0?-1:a+c[3].length}
return{plain:plain,a:a,b:b}}
function sentHtml(c){var p=parts(c),re=/[A-Za-z’']+/g,out="",last=0,i=0,prevOn=false,m,on,gap;
while((m=re.exec(p.plain))){on=sel===null?(m.index>=p.a&&m.index<p.b):(i===sel);
gap=p.plain.slice(last,m.index);
if(gap)out+=(sel===null&&i>0&&prevOn&&on)?'<span class="on">'+esc(gap)+'</span>':esc(gap);
out+='<span class="w'+(on?' on':'')+'" role="button" tabindex="0" data-i="'+i+'" data-w="'+esc(m[0])+'">'+esc(m[0])+'</span>';
last=re.lastIndex;prevOn=on;i++}
return out+esc(p.plain.slice(last))}
function wordBack(c){var o=wordOf(c);
if(selW&&selW.toLowerCase()!==o.toLowerCase()){var q=encodeURIComponent(selW.toLowerCase());
return '<p class="kk">'+esc(selW)+'</p><p class="def">Мағынасын суретке қарап өзің тап. Тексеру үшін:</p><div class="row" style="margin-top:10px"><a class="btn" target="_blank" rel="noopener" href="https://translate.google.com/?sl=en&tl=kk&text='+q+'&op=translate">Google Translate (KK)</a><a class="btn" target="_blank" rel="noopener" href="https://translate.google.com/?sl=en&tl=ru&text='+q+'&op=translate">Google Translate (RU)</a><a class="btn" target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english/'+q+'">Cambridge</a></div>'}
return '<p class="kk">'+esc(c[1]||"—")+'</p>'+(c[5]?'<p class="kk ru">'+esc(c[5])+'</p>':'')+(c[2]?'<p class="def">'+esc(c[2])+'</p>':'')}
function next(){shown=false;sel=null;selW=null;micStop();if(myUrl){URL.revokeObjectURL(myUrl);myUrl=null}myBuf=null;stopMine();micMsg="";cur=queue.length?queue[0]:null;render()}
function render(){
var a=all(),st=document.getElementById("stage"),done=total-queue.length;
document.getElementById("bar").style.width=(total?done/total*100:0)+"%";
document.getElementById("stat").textContent="Білемін: "+done+" / "+total+(queue.length?" · қалды: "+queue.length:"");
if(cur===null){st.innerHTML='<div class="card done"><p class="sent">Бәрін қайталап шықтың!</p><div class="row" style="justify-content:center"><button class="main" id="again" type="button">Қайтадан бастау</button></div></div>';
document.getElementById("again").onclick=function(){known=[];saveKnown();start()};return}
var c=a[cur],w=selW||wordOf(c),h='<div class="card"><p class="sent">'+sentHtml(c)+'</p><p class="tip" style="margin:0">Кез келген сөзді бас: сары белгі сол сөзге ауысады, сурет те сол сөз бойынша ашылады.</p>';
h+='<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q='+encodeURIComponent(w)+'">Суретті көру</a><button id="say" type="button">Тыңдау</button><button id="slow" type="button">Баяу тыңдау</button></div>';
h+='<div class="row">'+(rec?'<button id="micstop" type="button">⏹ Тоқтату</button><span class="tip" style="margin:0;align-self:center">Жазылуда… сөйле</span>':'<button id="mic" type="button">🎤 Жазу</button>')+(myUrl&&!rec?'<button id="mine" type="button">▶ Менің дауысым</button><button id="cmp" type="button">⇄ Салыстыру</button>':'')+'</div>'+(micMsg?'<p class="tip" style="margin:0">'+esc(micMsg)+'</p>':'');
if(shown){h+='<div class="back">'+(c[4]?'<p class="tr">'+esc(c[4])+'</p>':'')+(c[6]?'<p class="tr ru">'+esc(c[6])+'</p>':'')+wordBack(c)+'</div>';
h+='<div class="row"><button id="hard" type="button">Қайта қарау</button><button class="main" id="know" type="button">Білемін</button></div>'}
else h+='<div class="row"><button class="main" id="show" type="button">Жауабын көрсету</button></div>';
st.innerHTML=h+'</div>';
var b,sy=document.getElementById("say"),sl=document.getElementById("slow");
Array.prototype.forEach.call(st.querySelectorAll(".w"),function(el){var f=function(){sel=+el.getAttribute("data-i");selW=el.getAttribute("data-w");render()};el.onclick=f;el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
if(sy)sy.onclick=function(){speak(c[0],1)};
if(sl)sl.onclick=function(){speak(c[0],.65)};
var e1;if(e1=document.getElementById("mic"))e1.onclick=micStart;
if(e1=document.getElementById("micstop"))e1.onclick=micStop;
if(e1=document.getElementById("mine"))e1.onclick=playMine;
if(e1=document.getElementById("cmp"))e1.onclick=function(){stopMine();var go=false;function f(){if(!go){go=true;playMine(myOnset)}}speak(c[0],1,null,f);setTimeout(f,1500)};
if(b=document.getElementById("show"))b.onclick=function(){shown=true;render();document.getElementById("know")&&document.getElementById("know").focus()};
if(b=document.getElementById("know"))b.onclick=function(){var s=all()[cur][0];if(known.indexOf(s)<0){known.push(s);saveKnown()}queue.shift();next()};
if(b=document.getElementById("hard"))b.onclick=function(){queue.push(queue.shift());next()}}
document.getElementById("add").onclick=function(){
var w=document.getElementById("nw").value.trim(),s=document.getElementById("ns").value.trim(),k=document.getElementById("nk").value.trim(),m=document.getElementById("addmsg");
if(!w||!s){m.textContent="Сөзді де, сөйлемді де жаз.";return}
custom.push({w:w,s:s,k:k,d:"",t:document.getElementById("nt").value.trim()});
try{localStorage.setItem(KEY,JSON.stringify(custom))}catch(e){}
document.getElementById("nw").value=document.getElementById("ns").value=document.getElementById("nk").value=document.getElementById("nt").value="";
m.textContent="Қосылды. Ол қазіргі кезекке түсті.";
queue.push(all().length-1);total++;if(cur===null)next();else render()};
document.getElementById("reset").onclick=function(){known=[];saveKnown();start()};
var SHEET_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vT-gTVtuPGPLe-d8-t7LG78JSK5vXa2xTlnK6mSzbwgt0HXu9Nieu8Kunp9KOfFtlWGe5uka_ACjyj8/pub?gid=2018887702&single=true&output=csv";
function parseCSV(t){var rows=[],row=[],f="",q=false,i,ch;
for(i=0;i<t.length;i++){ch=t[i];
if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
else if(ch==='"')q=true;
else if(ch===","){row.push(f);f=""}
else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""}
else if(ch!=="\r")f+=ch}
if(f!==""||row.length){row.push(f);rows.push(row)}
return rows}
function loadSheet(){
if(!SHEET_CSV_URL){start();return}
document.getElementById("stage").innerHTML='<div class="card"><p class="sent">Жүктелуде…</p></div>';
fetch(SHEET_CSV_URL).then(function(r){return r.text()}).then(function(t){
var rows=parseCSV(t).slice(1).filter(function(r){return r[1]&&r[1].trim()}).map(function(r){return{w:(r[0]||"").trim(),s:r[1].trim(),k:(r[2]||"").trim(),d:(r[3]||"").trim(),t:(r[4]||"").trim(),rk:(r[5]||"").trim(),rt:(r[6]||"").trim()}});
SHEET=rows.length?rows:null;start()}).catch(function(){start()})}
loadSheet();
</script>
</body>
</html>
